<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8a83e">
  <title>Hearth · offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #0e0b08; color: #e9e2d6;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
    }
    .mark { color: #e8a83e; font-size: 3rem; line-height: 1; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; font-weight: 600; }
    p { margin: 0 0 1.5rem; color: #a99f90; }
    a {
      display: inline-block; background: #e8a83e; color: #0e0b08; text-decoration: none;
      font-weight: 600; padding: 0.7rem 1.4rem; border-radius: 12px; min-height: 44px; box-sizing: border-box;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">◈</div>
    <h1>No connection</h1>
    <p>Hearth needs the internet to show anything; nothing is stored on this phone.</p>
    <a href="/today">Try again</a>
  </main>
</body>
</html>
